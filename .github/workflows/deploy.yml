name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages + Worker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cv-builder.andersseen.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Wrangler 4.x requires Node >= 22.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          # This token must include Account: Cloudflare Pages:Edit.
          # The old Workers-only token fails here with Cloudflare API code 10000.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/analog/public --project-name=cv-builder --branch=main

      - name: Deploy PDF service to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          # This same token must also include Account: Workers Scripts:Edit
          # and Zone: Workers Routes:Edit scoped to andersseen.dev for the /api/* route.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
